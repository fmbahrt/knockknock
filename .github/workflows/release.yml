# Publishes the rendezvous image and Helm chart to GHCR when a GitHub release
# is published. The release tag is the version: v1.2.3 (or v1.2.3-rc.1).
#
#   image: ghcr.io/<owner>/knockknock-rendezvous:<version>
#   chart: oci://ghcr.io/<owner>/charts/rendezvous --version <version>
#
# The chart is published with image.repository and image.digest pointing at
# the image built in the same run, so a chart version always deploys exactly
# that image. Both get signed build provenance (gh attestation verify).
# Actions are pinned to commit SHAs; the comment names the release.

name: release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - id: version
        name: Version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ ! "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::release tag '$TAG' is not a semantic version like v1.2.3"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: go helm just
      - run: just rendezvous::lint rendezvous::test chart-lint

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/knockknock-rendezvous
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest and major.minor only for stable releases.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          flavor: latest=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=knockknock-rendezvous
            org.opencontainers.image.description=Rendezvous server for knockknock UDP NAT hole punching
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rendezvous
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the chart to the release
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io/${{ needs.verify.outputs.owner }}/charts
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/knockknock-rendezvous
      DIGEST: ${{ needs.image.outputs.digest }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: helm
      # For the attestation push; helm keeps its own login (below).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point the chart at the published image
        run: |
          values=charts/rendezvous/values.yaml
          grep -q '^  repository: knockknock/rendezvous$' "$values"
          grep -q '^  digest: ""$' "$values"
          sed -i \
            -e "s|^  repository: knockknock/rendezvous$|  repository: $IMAGE|" \
            -e "s|^  digest: \"\"$|  digest: \"$DIGEST\"|" \
            "$values"
          helm lint --strict charts/rendezvous
      - name: Package and push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/rendezvous --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/rendezvous-$VERSION.tgz" "oci://$REGISTRY" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "dist/rendezvous-$VERSION.tgz" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/rendezvous
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
