{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rendezvous.serviceAccountName" . }}
  labels:
    {{- include "rendezvous.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
